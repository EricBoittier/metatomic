# Conda environment aligned with metatomic-torch development and tox.
#
# Matches tox defaults: Python 3.13, PyTorch 2.12 (CUDA), metatensor-torch 0.9.x.
# Includes GCC 13 for nvcc's host compiler when the system default is GCC 14+.
#
# Pip packages are installed by scripts/create-conda-env.sh (not listed here) because
# conda's pip integration does not handle --extra-index-url reliably.
#
# On GPU clusters, load CUDA before activating, e.g.:
#   module load gcc/gcc-14.2.0-openmpi-5.0.5-cuda-12.6.1
#
# Create and configure:
#   ./scripts/create-conda-env.sh
#   conda activate metatomic-torch
#
# If `which python` still points to micromamba after activate, run:
#   source "$(conda info --base)/etc/profile.d/conda.sh"
#   conda activate metatomic-torch

name: metatomic-torch
channels:
  - conda-forge
dependencies:
  - python=3.13
  - cmake>=3.22
  - ninja
  - gcc_linux-64=13
  - gxx_linux-64=13
  - binutils_linux-64
  - pip
